<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobilmaschine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/materialdesignicons.min.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <h1 id="page-title">Dateien</h1>
            <div id="battery-indicator" class="battery-indicator hidden">
                <i class="mdi mdi-battery"></i>
                <span id="battery-percentage"></span>
            </div>
        </div>
    </header>

    <!-- Page: Dateien -->
    <div id="page-files" class="page active">
        <nav class="breadcrumb">
            <div id="breadcrumb" class="breadcrumb-inner">
                <a href="#" data-path="">Speicher</a>
            </div>
        </nav>

        <main>
            <div id="toolbar" class="toolbar">
                <span id="item-count" class="item-count"></span>
                <div class="toolbar-actions">
                    <button id="btn-new-folder" class="toolbar-btn" title="Neuer Ordner">
                        <i class="mdi mdi-folder-plus"></i>
                    </button>
                    <button id="btn-new-file" class="toolbar-btn" title="Neue Datei">
                        <i class="mdi mdi-file-plus"></i>
                    </button>
                    <button id="btn-paste" class="toolbar-btn" title="Einfügen" disabled>
                        <i class="mdi mdi-content-paste"></i>
                    </button>
                    <div class="sort-controls">
                        <div id="custom-select" class="custom-select">
                            <div class="custom-select-trigger">
                                <span class="custom-select-value">Name A-Z</span>
                                <i class="mdi mdi-chevron-down"></i>
                            </div>
                            <div class="custom-select-dropdown hidden">
                                <div class="custom-select-option" data-value="name-asc">Name A-Z</div>
                                <div class="custom-select-option" data-value="name-desc">Name Z-A</div>
                                <div class="custom-select-option" data-value="date-desc">Datum (neueste)</div>
                                <div class="custom-select-option" data-value="date-asc">Datum (aelteste)</div>
                                <div class="custom-select-option" data-value="size-desc">Groesse (absteigend)</div>
                                <div class="custom-select-option" data-value="size-asc">Groesse (aufsteigend)</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="file-list" class="file-list">
                <div class="loading">Wird geladen...</div>
            </div>
        </main>
    </div>

    <!-- Page: Nachrichten -->
    <div id="page-messages" class="page">
        <main>
            <div class="toolbar">
                <span id="sms-count" class="item-count"></span>
                <div class="toolbar-actions">
                    <button id="btn-refresh-sms" class="toolbar-btn" title="Aktualisieren">
                        <i class="mdi mdi-refresh"></i>
                    </button>
                </div>
            </div>
            <div id="sms-list" class="sms-list">
                <div class="loading">Wird geladen...</div>
            </div>
        </main>
    </div>

    <!-- Page: System -->
    <div id="page-system" class="page">
        <main>
            <div id="system-info" class="system-info">
                <div class="loading">Wird geladen...</div>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="files">
            <i class="mdi mdi-folder"></i>
            <span>Dateien</span>
        </button>
        <button class="nav-item" data-page="messages">
            <i class="mdi mdi-message-text"></i>
            <span>Nachrichten</span>
        </button>
        <button class="nav-item" data-page="system">
            <i class="mdi mdi-information"></i>
            <span>System</span>
        </button>
    </nav>

    <div id="context-menu" class="context-menu hidden"></div>

    <div id="drop-overlay" class="drop-overlay hidden">
        <div class="drop-overlay-content">
            <i class="mdi mdi-cloud-upload"></i>
            <span>Dateien hier ablegen</span>
        </div>
    </div>

    <div id="upload-panel" class="upload-panel hidden">
        <div class="upload-panel-header">
            <span id="upload-panel-title">Upload</span>
            <button id="upload-panel-close" class="lightbox-btn"><i class="mdi mdi-close"></i></button>
        </div>
        <div id="upload-panel-list" class="upload-panel-list"></div>
    </div>

    <div id="error-toast" class="error-toast hidden"></div>

    <div id="dialog-overlay" class="dialog-overlay hidden">
        <div class="dialog-backdrop"></div>
        <div class="dialog-box">
            <div class="dialog-header" id="dialog-title"></div>
            <div class="dialog-body">
                <p id="dialog-message"></p>
                <input id="dialog-input" type="text" class="dialog-input">
            </div>
            <div class="dialog-footer">
                <button id="dialog-cancel" class="dialog-btn dialog-btn-cancel">Abbrechen</button>
                <button id="dialog-confirm" class="dialog-btn dialog-btn-confirm">OK</button>
            </div>
        </div>
    </div>

    <div id="lightbox" class="lightbox hidden">
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-container">
            <div class="lightbox-header">
                <span id="lightbox-title" class="lightbox-title"></span>
                <div class="lightbox-actions">
                    <button id="lightbox-save" class="lightbox-btn lightbox-save-btn hidden" title="Speichern"><i class="mdi mdi-content-save"></i></button>
                    <a id="lightbox-download" class="lightbox-btn" title="Herunterladen"><i class="mdi mdi-download"></i></a>
                    <button id="lightbox-close" class="lightbox-btn" title="Schliessen"><i class="mdi mdi-close"></i></button>
                </div>
            </div>
            <div id="lightbox-body" class="lightbox-body"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
